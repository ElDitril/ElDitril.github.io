<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammed Samy BEJJTIT – ePortfolio</title>
  <meta name="description" content="ePortfolio de Mohammed Samy BEJJTIT, élève-ingénieur ENSEEIHT (3EA).">

  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <!--
    All the text of this site lives in  assets/js/content.js
    Edit it with  editor.html  (no coding needed).
  -->

  <main>

    <!-- #SIDEBAR -->
    <aside class="sidebar" data-sidebar>

      <div class="sidebar-info">
        <figure class="avatar-box">
          <img id="profile-photo" src="" alt="" width="80">
        </figure>

        <div class="info-content">
          <h1 class="name" id="profile-name"></h1>
          <p class="title" id="profile-title"></p>
        </div>

        <button class="info_more-btn" data-sidebar-btn>
          <span data-ui="showContacts"></span>
          <ion-icon name="chevron-down"></ion-icon>
        </button>
      </div>

      <div class="sidebar-info_more">
        <div class="separator"></div>
        <ul class="contacts-list" id="contacts-list"></ul>
        <div class="separator sidebar-extra-sep" id="extra-sep"></div>
        <div class="sidebar-buttons" id="sidebar-buttons"></div>
        <ul class="social-list" id="social-list"></ul>
      </div>

    </aside>


    <!-- #MAIN CONTENT -->
    <div class="main-content">

      <nav class="navbar">
        <ul class="navbar-list" id="navbar-list"></ul>
      </nav>

      <article class="about active" data-page="about">
        <header><h2 class="h2 article-title" data-ui="nav.about"></h2></header>
        <section class="about-text" id="about-text"></section>
        <section class="pitch" id="pitch"></section>
        <section class="service">
          <h3 class="h3 service-title" data-ui="interestsTitle"></h3>
          <ul class="service-list" id="interests-list"></ul>
        </section>
      </article>

      <article class="resume" data-page="resume">
        <header><h2 class="h2 article-title" data-ui="nav.resume"></h2></header>

        <section class="timeline">
          <div class="title-wrapper">
            <div class="icon-box"><ion-icon name="book-outline"></ion-icon></div>
            <h3 class="h3" data-ui="education"></h3>
          </div>
          <ol class="timeline-list" id="education-list"></ol>
        </section>

        <section class="timeline">
          <div class="title-wrapper">
            <div class="icon-box"><ion-icon name="trophy-outline"></ion-icon></div>
            <h3 class="h3" data-ui="activities"></h3>
          </div>
          <ol class="timeline-list" id="activities-list"></ol>
        </section>

        <section class="skill">
          <h3 class="h3 skills-title" data-ui="skills"></h3>
          <ul class="skills-labels content-card" id="skills-list"></ul>
        </section>
      </article>

      <article class="mobility" data-page="mobility">
        <header><h2 class="h2 article-title" data-ui="nav.mobility"></h2></header>
        <section class="about-text" id="mobility-intro"></section>

        <h3 class="h3 service-title" data-ui="mobilityProjects"></h3>
        <ul class="mobility-list" id="mobility-projects"></ul>

        <section class="timeline">
          <div class="title-wrapper">
            <div class="icon-box"><ion-icon name="calendar-outline"></ion-icon></div>
            <h3 class="h3" data-ui="roadmap"></h3>
          </div>
          <ol class="timeline-list" id="mobility-roadmap"></ol>
        </section>

        <section class="skill">
          <h3 class="h3 skills-title" data-ui="checklist"></h3>
          <ul class="checklist content-card" id="mobility-checklist"></ul>
        </section>
      </article>

      <article class="sports" data-page="sports">
        <header><h2 class="h2 article-title" data-ui="nav.sports"></h2></header>
        <section class="about-text" id="sports-intro"></section>
        <ul class="service-list" id="sports-list"></ul>
      </article>

    </div>

  </main>

  <script src="./assets/js/content.js"></script>
  <script src="./assets/js/script.js"></script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
